services:
  - type: web
    name: restless-studio
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_ACCOUNT_EMAIL
        value: adminresteless@gmail.com
      - key: GOOGLE_REDIRECT_URI
        value: https://restless-24-7.onrender.com/google/callback
      - key: GOOGLE_TIME_ZONE
        value: America/Montreal
      - key: APP_URL
        value: https://restless-24-7.onrender.com
      - key: MIXER_SLEEZE_PASSWORD
        sync: false
      - key: MIXER_KAYC_PASSWORD
        sync: false
      - key: MIXER_PPO_PASSWORD
        sync: false
      - key: MIXER_BOA_PASSWORD
        sync: false
